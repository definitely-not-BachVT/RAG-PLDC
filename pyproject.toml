[project]
name = "rag-pldc"
version = "0.1.0"
description = "Chatbot RAG và luyện trắc nghiệm môn Pháp luật đại cương (PTIT)"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "nicegui",
    "numpy",
    "pdfminer.six",
    "pypdfium2",
    "python-dotenv",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]
# Local models (bge-m3 embeddings, bge-reranker-v2-m3). On Windows the DirectML build also runs
# them on the GPU; install only one onnxruntime package, they share the module name.
local = [
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "tokenizers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real LLM/embedding APIs (needs keys in .env)",
    "slow: loads the local bge-m3 model (~2 GB)",
]
addopts = "-m 'not live and not slow'"
